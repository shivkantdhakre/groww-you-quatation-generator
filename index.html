<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Groww You – Service Quotation Generator</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/quotation.css" />
    <!-- jsPDF and html2canvas for PDF export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>

<body>
    <div class="app-container">
        <!-- Admin / Edit Panel (left) -->
        <aside class="admin-panel" id="adminPanel">
            <h2>Quotation Builder</h2>

            <section class="panel-section">
                <h3>Document Header & Intro</h3>
                <label>Quotation Subject:
                    <input type="text" id="quoteSubject" placeholder="e.g. Ads Management" />
                </label>
                <label>Company Subtitle:
                    <input type="text" id="companySubtitle"
                        placeholder="e.g. Groww You - Software Development & Marketing" />
                </label>
                <label>Intro Text:
                    <textarea id="introText" rows="3" placeholder="e.g. As per our discussion..."></textarea>
                </label>
            </section>

            <section class="panel-section">
                <h3>Meta Information</h3>
                <label>Quotation #: <input type="text" id="quoteNumber" /></label>
                <label>Date: <input type="text" id="quoteDate" placeholder="e.g. 19-May-2026" /></label>
                <label>Issued By: <input type="text" id="issuedBy" /></label>
                <label>Currency Select:
                    <select id="currencySelect">
                        <option value="INR">INR (₹)</option>
                        <option value="USD">USD ($)</option>
                        <option value="EUR">EUR (€)</option>
                    </select>
                </label>
            </section>

            <section class="panel-section">
                <h3>Client Information</h3>
                <label>Client Name: <input type="text" id="clientName" /></label>
                <label>Phone: <input type="text" id="clientPhone" /></label>
                <label>Email: <input type="email" id="clientEmail" /></label>
                <label>Service Package Title: <input type="text" id="clientPackage" /></label>
                <label>Service Package Description:
                    <textarea id="packageDescription" rows="3"
                        placeholder="Describe the package benefits..."></textarea>
                </label>
            </section>

            <section class="panel-section">
                <h3>Platforms Covered</h3>
                <label>Platforms:
                    <input type="text" id="platformsCovered" placeholder="e.g. 1. Instagram & Facebook Ads" />
                </label>
            </section>

            <section class="panel-section">
                <h3>Services Included</h3>
                <div id="servicesList"></div>
                <button id="addServiceBtn" class="add-btn">+ Add Service Detail</button>
            </section>

            <section class="panel-section">
                <h3>Pricing Info</h3>
                <label>Pricing Note (e.g. / month, / project):
                    <input type="text" id="priceUnit" placeholder="e.g. / month" />
                </label>
                <div id="pricingList"></div>
                <button id="addPricingBtn" class="add-btn">+ Add Price Item</button>
            </section>

            <section class="panel-section">
                <h3>Payment Terms</h3>
                <div id="termsList"></div>
                <button id="addTermBtn" class="add-btn">+ Add Payment Term</button>
            </section>

            <section class="panel-section">
                <h3>Regards & Signature</h3>
                <label>Regards Name: <input type="text" id="regardsName" /></label>
                <label>Regards Title: <input type="text" id="regardsTitle" /></label>
                <label>Regards Company: <input type="text" id="regardsCompany" /></label>
            </section>

            <section class="panel-actions">
                <button id="resetBtn" class="danger-btn">Reset</button>
                <button id="exportPdfBtn" class="action-btn">Export PDF</button>
            </section>
        </aside>

        <!-- Live Preview (right) -->
        <section class="preview-panel" id="previewContainer">
            <!-- Rendered pages will go here -->
        </section>
    </div>
    <script type="module" src="js/app.js"></script>
</body>

</html>
